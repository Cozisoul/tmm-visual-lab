<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMM Visual Lab - Test Runner</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header { 
            text-align: center; 
            margin-bottom: 30px; 
            color: #333;
        }
        .test-controls { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 30px; 
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-primary { 
            background: #007bff; 
            color: white; 
        }
        .btn-primary:hover { 
            background: #0056b3; 
            transform: translateY(-2px);
        }
        .btn-success { 
            background: #28a745; 
            color: white; 
        }
        .btn-success:hover { 
            background: #1e7e34; 
            transform: translateY(-2px);
        }
        .btn-warning { 
            background: #ffc107; 
            color: #212529; 
        }
        .btn-warning:hover { 
            background: #e0a800; 
            transform: translateY(-2px);
        }
        .progress-container { 
            margin-bottom: 30px; 
        }
        .progress-bar { 
            width: 100%; 
            height: 20px; 
            background: #e9ecef; 
            border-radius: 10px; 
            overflow: hidden;
        }
        .progress-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #28a745, #20c997); 
            width: 0%; 
            transition: width 0.3s ease;
        }
        .status { 
            text-align: center; 
            margin: 10px 0; 
            font-weight: bold;
        }
        .test-results { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 20px; 
            margin-top: 30px;
        }
        .test-card { 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 8px; 
            border-left: 4px solid #007bff;
        }
        .test-card.pass { 
            border-left-color: #28a745; 
            background: #d4edda;
        }
        .test-card.fail { 
            border-left-color: #dc3545; 
            background: #f8d7da;
        }
        .test-card.running { 
            border-left-color: #ffc107; 
            background: #fff3cd;
        }
        .test-card h4 { 
            margin: 0 0 10px 0; 
            color: #333;
        }
        .test-card .status { 
            font-weight: bold; 
            margin: 5px 0;
        }
        .test-card .details { 
            font-size: 14px; 
            color: #666;
        }
        .log-container { 
            background: #1e1e1e; 
            color: #f8f8f2; 
            padding: 20px; 
            border-radius: 8px; 
            margin-top: 30px; 
            max-height: 400px; 
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }
        .log-entry { 
            margin: 5px 0; 
            padding: 5px; 
            border-radius: 3px;
        }
        .log-info { 
            background: rgba(0, 123, 255, 0.1); 
        }
        .log-success { 
            background: rgba(40, 167, 69, 0.1); 
        }
        .log-error { 
            background: rgba(220, 53, 69, 0.1); 
        }
        .log-warning { 
            background: rgba(255, 193, 7, 0.1); 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 TMM Visual Lab - Test Runner</h1>
            <p>Comprehensive testing suite for all tools, sizes, and formats</p>
        </div>
        
        <div class="test-controls">
            <button class="btn btn-primary" onclick="startAllTests()">🚀 Run All Tests</button>
            <button class="btn btn-success" onclick="startQuickTest()">⚡ Quick Test</button>
            <button class="btn btn-warning" onclick="testSingleTool()">🔧 Test Single Tool</button>
            <button class="btn btn-primary" onclick="downloadReport()">📊 Download Report</button>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status" id="statusText">Ready to run tests</div>
        </div>
        
        <div class="test-results" id="testResults">
            <!-- Test results will be populated here -->
        </div>
        
        <div class="log-container" id="logContainer">
            <div class="log-entry log-info">Test runner initialized. Click a button to start testing.</div>
        </div>
    </div>

    <script>
        // Test configuration
        const testConfig = {
            tools: [
                'gridArchitect', 'posterComposer', 'bauhausAssembler', 
                'kineticTypeEngine', 'glyphDeconstructor', 'waveformSynthesizer',
                'universalRasterizer', 'videoSampler', 'colorSystemAnalyzer',
                'pixelSorter', 'truchetTiler', 'particleEngine',
                'rhythmSequencer', 'objectRasterizer3D', 'generativeComposer'
            ],
            sizes: [
                { name: 'square', width: 1080, height: 1080 },
                { name: 'landscape', width: 1920, height: 1080 },
                { name: 'portrait', width: 1080, height: 1920 },
                { name: 'small', width: 512, height: 512 },
                { name: 'large', width: 2048, height: 2048 }
            ],
            formats: ['png', 'jpg', 'svg', 'pdf']
        };

        let currentTest = 0;
        let totalTests = 0;
        let testResults = [];

        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateProgress(current, total) {
            const percentage = (current / total) * 100;
            document.getElementById('progressFill').style.width = `${percentage}%`;
            document.getElementById('statusText').textContent = `Running test ${current} of ${total} (${percentage.toFixed(1)}%)`;
        }

        function addTestResult(tool, size, format, status, details = {}) {
            const testCard = document.createElement('div');
            testCard.className = `test-card ${status}`;
            
            const testName = `${tool}_${size.name}_${format}`;
            testCard.innerHTML = `
                <h4>${testName}</h4>
                <div class="status">${status.toUpperCase()}</div>
                <div class="details">
                    <p><strong>Tool:</strong> ${tool}</p>
                    <p><strong>Size:</strong> ${size.width}x${size.height}</p>
                    <p><strong>Format:</strong> ${format.toUpperCase()}</p>
                    ${details.filename ? `<p><strong>File:</strong> ${details.filename}</p>` : ''}
                    ${details.size ? `<p><strong>Size:</strong> ${(details.size/1024).toFixed(1)} KB</p>` : ''}
                    ${details.error ? `<p><strong>Error:</strong> ${details.error}</p>` : ''}
                </div>
            `;
            
            document.getElementById('testResults').appendChild(testCard);
            
            testResults.push({
                tool, size, format, status, details,
                timestamp: new Date().toISOString()
            });
        }

        async function simulateTest(tool, size, format) {
            // Simulate test execution
            const delay = Math.random() * 1000 + 500; // 500-1500ms
            await new Promise(resolve => setTimeout(resolve, delay));
            
            // Simulate success/failure
            const success = Math.random() > 0.1; // 90% success rate
            
            if (success) {
                const filename = `test-results/downloads/${format}/${tool}_${size.name}_${format}.${format}`;
                const fileSize = Math.floor(Math.random() * 1000000) + 100000;
                
                return {
                    status: 'pass',
                    details: {
                        filename: filename,
                        size: fileSize
                    }
                };
            } else {
                return {
                    status: 'fail',
                    details: {
                        error: 'Simulated test failure'
                    }
                };
            }
        }

        async function startAllTests() {
            log('Starting comprehensive test suite...', 'info');
            
            totalTests = testConfig.tools.length * testConfig.sizes.length * testConfig.formats.length;
            currentTest = 0;
            testResults = [];
            
            document.getElementById('testResults').innerHTML = '';
            
            for (const tool of testConfig.tools) {
                log(`Testing tool: ${tool}`, 'info');
                
                for (const size of testConfig.sizes) {
                    for (const format of testConfig.formats) {
                        currentTest++;
                        updateProgress(currentTest, totalTests);
                        
                        log(`  Testing ${tool} - ${size.name} - ${format}`, 'info');
                        
                        try {
                            const result = await simulateTest(tool, size, format);
                            addTestResult(tool, size, format, result.status, result.details);
                            
                            if (result.status === 'pass') {
                                log(`    ✅ PASSED`, 'success');
                            } else {
                                log(`    ❌ FAILED: ${result.details.error}`, 'error');
                            }
                        } catch (error) {
                            addTestResult(tool, size, format, 'error', { error: error.message });
                            log(`    💥 ERROR: ${error.message}`, 'error');
                        }
                    }
                }
            }
            
            log('All tests completed!', 'success');
            updateProgress(totalTests, totalTests);
            document.getElementById('statusText').textContent = `Completed ${totalTests} tests`;
        }

        async function startQuickTest() {
            log('Starting quick test (first 3 tools only)...', 'info');
            
            const quickTools = testConfig.tools.slice(0, 3);
            const quickSizes = testConfig.sizes.slice(0, 2);
            const quickFormats = testConfig.formats.slice(0, 2);
            
            totalTests = quickTools.length * quickSizes.length * quickFormats.length;
            currentTest = 0;
            testResults = [];
            
            document.getElementById('testResults').innerHTML = '';
            
            for (const tool of quickTools) {
                for (const size of quickSizes) {
                    for (const format of quickFormats) {
                        currentTest++;
                        updateProgress(currentTest, totalTests);
                        
                        const result = await simulateTest(tool, size, format);
                        addTestResult(tool, size, format, result.status, result.details);
                    }
                }
            }
            
            log('Quick test completed!', 'success');
        }

        function testSingleTool() {
            const tool = prompt('Enter tool name to test:', 'gridArchitect');
            if (tool && testConfig.tools.includes(tool)) {
                log(`Testing single tool: ${tool}`, 'info');
                // Implementation for single tool testing
            } else {
                log('Invalid tool name', 'error');
            }
        }

        function downloadReport() {
            const report = {
                timestamp: new Date().toISOString(),
                totalTests: testResults.length,
                passed: testResults.filter(r => r.status === 'pass').length,
                failed: testResults.filter(r => r.status === 'fail').length,
                results: testResults
            };
            
            const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `test-report-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            log('Test report downloaded!', 'success');
        }

        // Initialize
        log('Test runner ready', 'info');
    </script>
</body>
</html>
