<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>TMM-OS Visual Lab v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #000000;
        color: #e4e4e7;
        font-family: "Inter", sans-serif;
        overflow: hidden;
        touch-action: none;
      }
      .font-mono {
        font-family: "JetBrains Mono", monospace;
      }

      /* BRUTALIST SCROLLBAR - UX IMPROVED */
      ::-webkit-scrollbar {
        width: 12px; /* Wider for easier grabbing */
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b;
        border-left: 1px solid #27272a;
      }
      ::-webkit-scrollbar-thumb {
        background: #52525b; /* Lighter for better contrast */
        border: 2px solid #09090b; /* Padding effect */
        border-radius: 0;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #f97316; /* Orange hover */
      }

      /* BRUTALIST SLIDER */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        background: transparent;
      }
      input[type="range"]:focus {
        outline: none;
      }

      /* Track */
      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 14px; /* Taller for easier clicking */
        cursor: pointer;
        background: #18181b;
        border: 1px solid #3f3f46;
      }

      /* Thumb */
      input[type="range"]::-webkit-slider-thumb {
        height: 14px;
        width: 14px;
        background: #a1a1aa;
        border: 1px solid #000;
        cursor: pointer;
        -webkit-appearance: none;
        margin-top: -1px; /* Align with border */
      }
      input[type="range"]:hover::-webkit-slider-thumb {
        background: #f97316;
      }

      /* Custom Checkbox Toggle */
      .toggle-checkbox:checked {
        right: 0;
        border-color: #f97316;
      }
      .toggle-checkbox:checked + .toggle-label {
        background-color: #f97316;
      }
    </style>

    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
